name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest   # WPF + WinForms hanya bisa dibangun di Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/ZaxLet/ZaxLet.csproj -c Release
      - name: Self-contained tests
        run: dotnet run -c Release --project tests/ZaxLet.Tests/ZaxLet.Tests.csproj   # exit code != 0 bila ada tes gagal
